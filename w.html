<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>CCOMOS 위젯</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  #off { position: fixed; left: 12px; top: 12px; font: 700 14px 'Malgun Gothic', sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 6px 12px; border-radius: 8px; display: none; }
  #dbg { position: fixed; left: 8px; bottom: 8px; right: 8px; font: 12px/1.4 monospace; color: #0f0; background: rgba(0,0,0,.75); padding: 6px 8px; border-radius: 6px; display: none; white-space: pre-wrap; z-index: 9; }
</style>
</head>
<body>
<iframe id="f" allow="autoplay; microphone; local-network-access; loopback-network" title="CCOMOS"></iframe>
<div id="off">CCOMOS 프로그램이 꺼져 있어요 · 켜면 자동으로 나와요</div>
<div id="dbg"></div>
<script>
// 틱톡 LIVE Studio처럼 https 주소만 받는 프로그램용 중계 페이지.
// 이 페이지는 내 PC에서 돌아가는 CCOMOS(http://127.0.0.1:4848)의 위젯을 그대로 띄워요.
(function () {
  var p = new URLSearchParams(location.search);
  var w = String(p.get('w') || 'scene').replace(/[^a-z0-9-]/gi, '');
  var port = Number(p.get('port')) || 4848;
  var debug = p.has('debug');
  p.delete('w'); p.delete('port'); p.delete('debug');
  var qs = p.toString();
  var base = 'http://127.0.0.1:' + port;
  var url = base + '/overlay/' + w + (qs ? '?' + qs : '');
  var f = document.getElementById('f');
  var off = document.getElementById('off');
  var dbg = document.getElementById('dbg');
  var shown = false, tries = 0, last = '';
  function log() {
    if (!debug) return;
    dbg.style.display = 'block';
    dbg.textContent = 'CCOMOS 중계 v2\n' + navigator.userAgent + '\n대상: ' + url + '\n시도 ' + tries + '번 · 마지막: ' + last + (shown ? '\n→ 위젯 띄움' : '');
  }
  if (debug && navigator.permissions) {
    ['local-network-access', 'loopback-network'].forEach(function (n) {
      navigator.permissions.query({ name: n }).then(function (s) { last += ' [' + n + ':' + s.state + ']'; log(); }).catch(function () {});
    });
  }
  function show() { if (shown) return; shown = true; off.style.display = 'none'; f.src = url; log(); setTimeout(watch, 5000); }
  // 위젯을 띄운 뒤에도 계속 확인: 프로그램이 꺼졌다가(오류) 다시 켜지면(성공) 위젯을 새로 불러와 자동 복구
  // (응답 없음/권한 대기는 무시 — 확실히 꺼졌다 켜진 경우에만 다시 불러옴)
  var down = false;
  function watch() {
    var img = new Image();
    var done = false;
    img.onload = function () {
      if (done) return; done = true;
      if (down) { down = false; last = 'recovered'; f.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now(); log(); }
      setTimeout(watch, 5000);
    };
    img.onerror = function () { if (done) return; done = true; if (!down) { down = true; last = 'down'; log(); } setTimeout(watch, 3000); };
    img.src = base + '/ping.gif?t=' + Date.now();
    setTimeout(function () { if (done) return; done = true; setTimeout(watch, 5000); }, 4000);
  }
  function ping() {
    tries++;
    var img = new Image();
    var done = false;
    img.onload = function () { if (done) return; done = true; last = 'ok'; show(); };
    img.onerror = function () {
      if (done) return; done = true; last = 'error';
      if (!shown) { off.style.display = p.has('quiet') ? 'none' : 'block'; setTimeout(ping, 3000); }
      log();
    };
    img.src = base + '/ping.gif?t=' + Date.now();
    setTimeout(function () {
      if (done) return; done = true; last = 'timeout';
      // 응답이 없으면(권한 대기 등) 일단 바로 띄워 봄
      if (!shown && tries >= 2) show(); else if (!shown) setTimeout(ping, 1500);
      log();
    }, 4000);
    log();
  }
  ping();
})();
</script>
</body>
</html>
